<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Images</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <figure>
      <img src="image.avif" alt="Train image" height="300">
      <figcaption>Train image</figcaption>
    </figure>

    <h2>Vehicle Detail</h2>
    
    <table>
        <thead>
            <tr>
                <th>Sno</th>
                <th>Image</th>
                <th>Image Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td><img src="image.avif" alt="Train image" height="100"></td>
                <td>Train</td>
            </tr>
            <tr>
                <td>2</td>
                <td><img src="image.avif" alt="Car image" height="100"></td>
                <td>Car</td>
            </tr>
            <tr>
                <td>3</td>
                <td><img src="image.avif" alt="Bus image" height="100"></td>
                <td>Bus</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">End of Vehicle List</td>
            </tr>
        </tfoot>
    </table>

  </body>
</html>
